<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover North Carolina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a bright travel-bureau welcome, loud and friendly, made to be read from 3 meters away at a fair stand
   IDEA: the state's own welcome sign and vintage travel posters, one landmark per poster, looping by itself
   PICTURE: a big flat-color landmark scene on the right of every slide (mountains, lighthouse, the 1903 Flyer, skyline…)
   COLOUR and TYPE: Carolina blue, deep pine, sunset orange, cream; Alfa Slab One like park signs + Nunito Sans
   LAYOUT: full-screen 16:9 slide, text column left, picture right, progress bar + scan-to-play badge in the corner */
:root{color-scheme:light;--blue:#4b9cd3;--navy:#13294b;--pine:#1f4d3a;--sun:#f28c28;--cream:#fff6e5;--ink:#13294b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;font:18px/1.45 "Nunito Sans",system-ui,sans-serif;color:var(--ink)}
.deck{position:fixed;inset:0;display:grid;place-items:center}
.frame{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--cream);container-type:size}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s;background:var(--bg,var(--cream));color:var(--fg,var(--ink))}
.slide.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.txt{display:flex;flex-direction:column;justify-content:center;gap:2.2cqh;padding:7cqh 3cqw 9cqh 6cqw;z-index:2}
.kick{font-weight:800;font-size:2.6cqh;letter-spacing:.02em;color:var(--acc,var(--sun))}
h1{font:400 9cqh/1.02 "Alfa Slab One",Georgia,serif;margin:0;text-wrap:balance}
.big{font:400 15cqh/1 "Alfa Slab One",Georgia,serif;color:var(--acc,var(--sun))}
.big small{display:block;font:800 2.7cqh/1.3 "Nunito Sans",sans-serif;color:var(--fg,var(--ink));margin-top:1cqh}
p{margin:0;font-size:3.1cqh;line-height:1.4;max-width:34ch}
ul{margin:0;padding:0;list-style:none;display:grid;gap:1.4cqh;font-size:3cqh}
li{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:1.4cqw;align-items:baseline}li b{color:var(--acc,var(--sun));white-space:nowrap;min-width:max-content}
.pic{position:relative}.pic svg{position:absolute;inset:0;width:100%;height:100%}
.slide.on .pic svg{animation:drift 9s ease-out both}
@keyframes drift{from{transform:scale(1.07) translateX(1.5%)}to{transform:scale(1) translateX(0)}}
.bar{position:absolute;left:0;bottom:0;height:.8cqh;background:var(--sun);width:0;z-index:5}
.dots{position:absolute;left:6cqw;bottom:3.2cqh;display:flex;gap:.8cqw;z-index:5}
.dots button{width:1.4cqh;height:1.4cqh;border-radius:50%;border:0;padding:0;background:rgba(127,127,127,.45);cursor:pointer}
.dots button.on{background:var(--sun)}
.badge{position:absolute;right:2.2cqw;bottom:3.2cqh;z-index:6;display:flex;align-items:center;gap:1.2cqw;background:#fff;border-radius:2cqh;padding:1.2cqh 1.6cqh 1.2cqh 2cqh;box-shadow:0 1cqh 3cqh rgba(0,0,0,.25);font:800 2.3cqh/1.15 "Nunito Sans",sans-serif;color:var(--navy);transition:opacity .6s}
.badge img{width:13cqh;height:13cqh;image-rendering:pixelated}
.badge.hide{opacity:0}
.ctl{position:absolute;top:2.4cqh;right:2.2cqw;z-index:7;display:flex;gap:1cqw;opacity:.25;transition:opacity .3s}
.frame:hover .ctl{opacity:1}
.ctl button{font:800 2cqh "Nunito Sans",sans-serif;min-height:44px;padding:0 1.6cqw;border-radius:99px;border:0;background:rgba(255,255,255,.9);color:var(--navy);cursor:pointer}
.ctl button:focus-visible,.dots button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.final{grid-template-columns:1fr;place-items:center;text-align:center}
.final .txt{align-items:center;padding:6cqh}
.final p{font-size:3.4cqh;max-width:46ch}.final img{width:44cqh;height:44cqh;background:#fff;padding:2cqh;border-radius:3cqh;border:1cqh solid var(--sun);image-rendering:pixelated}
/* modo foto: la foto llena toda la diapositiva y el texto va encima con una sombra */
.slide .ph{display:none}
.slide.photo{grid-template-columns:minmax(0,1fr);--acc:#f6c14b !important}
.slide.photo .ph{display:block;position:absolute;inset:0;background:center/cover no-repeat}
.slide.photo.on .ph{animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.slide.photo .pic{display:none}
.slide.photo .txt{position:relative;max-width:62%;color:#fff;background:linear-gradient(90deg,rgba(8,18,36,.88) 0%,rgba(8,18,36,.6) 70%,transparent);min-height:100%}
.slide.photo .kick,.slide.photo .big,.slide.photo li b{text-shadow:0 2px 12px rgba(0,0,0,.5)}
.slide.photo .big small{color:#fff}
.credit{position:absolute;left:6cqw;bottom:6.5cqh;z-index:3;font-size:1.6cqh;color:rgba(255,255,255,.75);display:none}.slide.photo .credit{display:block}
.panel{position:absolute;inset:0;z-index:20;background:rgba(8,18,36,.94);color:#fff;display:none;overflow:auto;padding:4cqh 5cqw}
.panel.open{display:block}
.panel h2{font:400 5cqh "Alfa Slab One",Georgia,serif;margin:0 0 1cqh}
.panel p{font-size:2.4cqh;max-width:none;margin-bottom:2cqh;color:#cfe2f3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.cell{background:rgba(255,255,255,.08);border-radius:14px;padding:10px;display:grid;gap:8px;font:700 15px "Nunito Sans",sans-serif}
.thumb{aspect-ratio:16/9;border-radius:10px;background:#1a2a44 center/cover no-repeat;display:grid;place-items:center;color:#8fb0d6;font-size:13px}
.row{display:flex;gap:8px}
.row label,.row button,.panel .close{flex:1;min-height:44px;display:grid;place-items:center;border-radius:99px;border:0;background:#f28c28;color:#13294b;font:800 15px "Nunito Sans",sans-serif;cursor:pointer}
.row button{background:rgba(255,255,255,.2);color:#fff}
.row input{display:none}
.panel .close{position:sticky;top:0;float:right;padding:0 22px;background:#fff}
@media (prefers-reduced-motion:reduce){.slide.on .pic svg,.slide.photo.on .ph{animation:none}.slide{transition:none}}
</style></head><body>

const host=document.getElementById('slides'),dots=document.getElementById('dots');
host.innerHTML=S.map((s,i)=>s.final?
 `<section class="slide final" style="--bg:${s.bg};--fg:${s.fg};--acc:${s.acc}"><div class="txt"><div class="kick">North Carolina AR Adventure</div><h1>Scan to play!</h1><img src="${QR}" alt="QR code to play the game"><p>Fly with the Wright brothers, play golf at Pinehurst, sail the Outer Banks and shoot hoops with the Hornets.</p></div></section>`:
 `<section class="slide" style="--bg:${s.bg};--fg:${s.fg||'#13294b'};--acc:${s.acc}"><div class="ph"></div><div class="txt"><div class="kick">${s.kick}</div><h1>${s.h}</h1>${s.big?`<div class="big">${s.big}<small>${s.small}</small></div>`:''}${s.p?`<p>${s.p}</p>`:''}${s.li?`<ul>${s.li.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('')}</ul>`:''}</div><div class="credit">${s.by?`Photo: ${s.by} · Wikimedia Commons`:''}</div><div class="pic"><svg viewBox="0 0 640 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s.pic}</svg></div></section>`).join('');
dots.innerHTML=S.map((_, i)=>`<button aria-label="Slide ${i+1}"></button>`).join('');
const slides=[...host.children],db=[...dots.children],bar=document.getElementById('bar'),badge=document.getElementById('badge');
const DUR=9000; let cur=0,t0=performance.now(),paused=false,acc=0;
function show(i){cur=(i+S.length)%S.length;slides.forEach((s,k)=>s.classList.toggle('on',k===cur));db.forEach((d,k)=>d.classList.toggle('on',k===cur));badge.classList.toggle('hide',!!S[cur].final);t0=performance.now();acc=0}
function tick(now){if(!paused){const p=Math.min(1,(acc+now-t0)/DUR);bar.style.width=(p*100)+'%';if(p>=1)show(cur+1)}requestAnimationFrame(tick)}
db.forEach((d,k)=>d.addEventListener('click',()=>show(k)));
const bp=document.getElementById('bPause');
bp.addEventListener('click',()=>{if(paused){t0=performance.now();paused=false;bp.textContent='Pause'}else{acc+=performance.now()-t0;paused=true;bp.textContent='Play'}});
document.getElementById('bFull').addEventListener('click',()=>{const f=document.getElementById('frame').parentNode;try{(document.fullscreenElement?document.exitFullscreen():f.requestFullscreen()).catch(()=>{})}catch(e){}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);if(e.key===' '){e.preventDefault();bp.click()}});
// fotos propias: se guardan en este navegador (IndexedDB) y reemplazan el dibujo de cada diapositiva
const urls={};let idb=null;
const store=(mode)=>idb.transaction('p',mode).objectStore('p');
function drawGrid(){document.getElementById('grid').innerHTML=S.map((s,i)=>s.final?'':`<div class="cell"><div class="thumb" style="${urls[i]?`background-image:url('${urls[i]}')`:''}">${urls[i]?'':'No photo yet'}</div><div>${i+1}. ${s.h}</div><div class="row"><label>Choose photo<input type="file" accept="image/*" data-i="${i}"></label>${urls[i]?`<button data-rm="${i}">Remove</button>`:''}</div></div>`).join('')}
function applyPhoto(i,blob){const sl=slides[i];if(!sl||S[i].final)return;if(urls[i])URL.revokeObjectURL(urls[i]);if(blob){own.add(i);urls[i]=URL.createObjectURL(blob);sl.querySelector('.ph').style.backgroundImage=`url("${urls[i]}")`;sl.classList.add('photo')}else{delete urls[i];sl.querySelector('.ph').style.backgroundImage='';sl.classList.remove('photo')}drawGrid()}
const grid=document.getElementById('grid');
grid.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0],i=+e.target.dataset.i;if(!f)return;applyPhoto(i,f);try{store('readwrite').put(f,i)}catch(_){}});
grid.addEventListener('click',e=>{const i=e.target.dataset.rm;if(i===undefined)return;applyPhoto(+i,null);try{store('readwrite').delete(+i)}catch(_){}});
const panel=document.getElementById('panel');
document.getElementById('bPhotos').addEventListener('click',()=>{drawGrid();panel.classList.add('open');if(!paused)bp.click()});
document.getElementById('bClose').addEventListener('click',()=>{panel.classList.remove('open');if(paused)bp.click()});
try{const rq=indexedDB.open('nc-stand-photos',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('p');rq.onsuccess=()=>{idb=rq.result;try{const c=store('readonly').openCursor();c.onsuccess=()=>{const k=c.result;if(k){applyPhoto(+k.key,k.value);k.continue()}}}catch(_){}}}catch(_){}
const own=new Set();
S.forEach((s,i)=>{if(!s.img)return;const u='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(s.img)+'?width=1920',im=new Image();im.onload=()=>{if(own.has(i))return;const sl=slides[i];sl.querySelector('.ph').style.backgroundImage=`url("${u}")`;sl.classList.add('photo')};im.src=u});
show(0);requestAnimationFrame(tick);
}
</script></body></html>
